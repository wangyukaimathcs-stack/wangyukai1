<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#182b50">
  <meta name="description" content="拉动弹弓，发射郝祥宏，挑战三关的手机小游戏。">
  <title>愤怒的郝祥宏</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='29' fill='%23f9c64d'/%3E%3Cpath d='M14 36 5 12M14 36l20 12m16-12 9-24M50 36 30 48' fill='none' stroke='%23182b50' stroke-width='6' stroke-linecap='round'/%3E%3C/svg%3E">
  <style>
    :root{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:#fff;background:#142543}*{box-sizing:border-box}html,body{margin:0;min-height:100%;overscroll-behavior:none}body{display:flex;justify-content:center;background:radial-gradient(circle at 50% 0%,#355d82,#142543 74%)}button{font:inherit;cursor:pointer;border:0}main{width:min(100%,520px);min-height:100svh;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 14px) 14px calc(env(safe-area-inset-bottom) + 16px);gap:12px}.top{display:flex;align-items:center;justify-content:space-between;gap:8px}.title{font-size:clamp(24px,7vw,32px);font-weight:950;letter-spacing:-.04em;margin:0;line-height:1.1;text-shadow:0 3px #0e2340}.pill{background:#ffffff20;border:1px solid #ffffff30;border-radius:999px;padding:9px 12px;font-size:14px;font-weight:800;white-space:nowrap}.board-wrap{position:relative;flex:1;min-height:420px;max-height:720px;border:4px solid #dce8fb;border-radius:24px;overflow:hidden;background:#9edcf0;box-shadow:0 14px 0 #0a1b34,0 22px 30px #071a3580;touch-action:none}.board-wrap:before{content:"";position:absolute;inset:0;box-shadow:inset 0 0 0 2px #263c5870;z-index:2;pointer-events:none;border-radius:19px}canvas{display:block;width:100%;height:100%;touch-action:none}.status{position:absolute;top:14px;left:50%;transform:translateX(-50%);background:#142543df;border:1px solid #ffffff55;border-radius:12px;padding:7px 12px;font-weight:850;font-size:15px;white-space:nowrap;pointer-events:none;max-width:90%;overflow:hidden;text-overflow:ellipsis}.bottom{display:flex;justify-content:space-between;align-items:center;gap:12px}.hint{font-size:15px;line-height:1.45;color:#e7f4ff;margin:0}.btn{background:#f9c64d;color:#1a2943;font-weight:900;border-radius:14px;min-height:48px;padding:0 17px;box-shadow:0 5px 0 #b36f24;white-space:nowrap}.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #b36f24}.overlay{position:absolute;inset:0;background:#11284cc9;display:none;align-items:center;justify-content:center;padding:24px;z-index:4;text-align:center}.overlay.show{display:flex}.card{background:#fff8e8;color:#172748;border:4px solid #fff;border-radius:25px;padding:25px 20px;box-shadow:0 12px 0 #0a1d3b;max-width:340px;width:100%}.card h2{font-size:30px;margin:0 0 9px}.card p{font-size:17px;line-height:1.55;margin:0 0 21px}.card .btn{font-size:18px;min-width:140px}@media(max-height:700px){main{gap:8px}.board-wrap{min-height:350px}.hint{font-size:14px}}@media(min-width:700px){main{padding-top:24px;padding-bottom:28px}}
  </style>
</head>
<body>
  <main>
    <header class="top"><h1 class="title">愤怒的郝祥宏</h1><span class="pill" id="levelLabel">第 1 / 3 关</span></header>
    <div class="board-wrap" id="board"><canvas id="game" aria-label="弹弓闯关游戏：拖动左侧头像向后拉，松手发射"></canvas><div class="status" id="status">点右边的目标直接发射！</div><div class="overlay" id="overlay"><div class="card"><h2 id="resultTitle"></h2><p id="resultText"></p><button class="btn" id="advance"></button></div></div></div>
    <footer class="bottom"><p class="hint">点右侧目标即可发射；<br>也可以拖动弹弓瞄准。</p><button class="btn" id="restart" type="button">重开本关</button></footer>
  </main>
  <script>
  (()=>{
    const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
    const board=document.getElementById('board'),status=document.getElementById('status'),overlay=document.getElementById('overlay');
    const levelLabel=document.getElementById('levelLabel'),resultTitle=document.getElementById('resultTitle'),resultText=document.getElementById('resultText'),advance=document.getElementById('advance');
    const faceData=["assets/face-1.png", "assets/face-2.png", "assets/face-3.png", "assets/face-4.png"];const imgs=faceData.map(src=>{const i=new Image();i.src=src;return i});const hero=new Image();hero.src="portrait.jpg";
    const W=390,H=620,ground=548,sling={x:83,y:426},G=.28;
    const stages=[
      {ammo:4,targets:[{x:308,y:480,r:22,hp:1},{x:310,y:392,r:22,hp:1}],blocks:[{x:270,y:504,w:80,h:15},{x:272,y:416,w:76,h:15},{x:277,y:432,w:15,h:72},{x:333,y:432,w:15,h:72}]},
      {ammo:4,targets:[{x:285,y:474,r:21,hp:1},{x:340,y:474,r:21,hp:1},{x:312,y:375,r:21,hp:1}],blocks:[{x:258,y:500,w:105,h:14},{x:263,y:404,w:100,h:14},{x:267,y:418,w:14,h:81},{x:343,y:418,w:14,h:81}]},
      {ammo:5,targets:[{x:255,y:478,r:20,hp:1},{x:325,y:478,r:20,hp:1},{x:286,y:392,r:20,hp:1},{x:346,y:351,r:20,hp:1}],blocks:[{x:233,y:504,w:132,h:14},{x:235,y:418,w:119,h:15},{x:240,y:433,w:15,h:71},{x:339,y:433,w:15,h:71},{x:303,y:375,w:67,h:13}]}
    ];
    let level=0,shots=0,targets=[],blocks=[],ball=null,drag=false,dragPoint={x:0,y:0},particles=[],trails=[],frame=0,phase='ready',settle=0,last=0;
    function resize(){const d=Math.min(devicePixelRatio||1,2);canvas.width=W*d;canvas.height=H*d;ctx.setTransform(d,0,0,d,0,0)}
    function load(n){level=n;shots=0;targets=stages[n].targets.map((v,i)=>({...v,alive:true,face:(i+n)%4}));blocks=stages[n].blocks.map(v=>({...v,alive:true}));ball=null;drag=false;particles=[];trails=[];phase='ready';settle=0;overlay.classList.remove('show');levelLabel.textContent=`第 ${n+1} / 3 关`;status.textContent='点右边的目标直接发射！'}
    function screen(e){const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}
    function clampPull(p){let dx=p.x-sling.x,dy=p.y-sling.y;const l=Math.hypot(dx,dy);if(l>91){dx*=91/l;dy*=91/l}return{x:sling.x+dx,y:sling.y+dy}}
    function launch(x,y,vx,vy,autoTarget=null){ball={x,y,vx,vy,r:21,active:true,autoTarget};shots++;phase='flying';settle=0;trails=[];status.textContent=`已发射 ${shots} / ${stages[level].ammo} 发`}
    function tapFire(p){const alive=targets.filter(t=>t.alive);if(!alive.length)return;const target=alive.reduce((a,b)=>Math.hypot(a.x-p.x,a.y-p.y)<Math.hypot(b.x-p.x,b.y-p.y)?a:b);const vx=13.5,frames=(target.x-sling.x)/vx,vy=(target.y-sling.y-G*frames*(frames+1)/2)/frames;launch(sling.x,sling.y,vx,vy,target)}
    canvas.addEventListener('pointerdown',e=>{if(phase!=='ready')return;const p=screen(e);if(p.x>160){e.preventDefault();tapFire(p);return}if(Math.hypot(p.x-sling.x,p.y-sling.y)>80)return;e.preventDefault();canvas.setPointerCapture(e.pointerId);drag=true;dragPoint=clampPull(p);status.textContent='瞄准中…松手发射';});
    canvas.addEventListener('pointermove',e=>{if(!drag)return;e.preventDefault();dragPoint=clampPull(screen(e))});
    function release(){if(!drag)return;drag=false;const dx=sling.x-dragPoint.x,dy=sling.y-dragPoint.y;if(Math.hypot(dx,dy)<8){status.textContent='往后拉远一点！';return}launch(dragPoint.x,dragPoint.y,dx*.20,dy*.20)}
    canvas.addEventListener('pointerup',release);canvas.addEventListener('pointercancel',()=>{drag=false});
    document.getElementById('restart').onclick=()=>load(level);
    advance.onclick=()=>load(level===2?0:level+1);
    function finish(win){phase='end';resultTitle.textContent=win?(level===2?'全部通关！':'过关！'):'这关没打中';resultText.textContent=win?(level===2?'郝祥宏的弹弓冒险完成啦！':'准备挑战下一关。'):'调整角度，再来一次！';advance.textContent=win?(level===2?'从头再玩':'下一关'):'再试一次';advance.onclick=()=>load(win?(level===2?0:level+1):level);overlay.classList.add('show');status.textContent=win?'目标全部命中！':'子弹用完了'}
    function burst(x,y){for(let i=0;i<12;i++){const a=Math.random()*Math.PI*2,s=1+Math.random()*3;particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:30})}}
    function update(){frame++;if(phase==='flying'&&ball){ball.vy+=G;ball.x+=ball.vx;ball.y+=ball.vy;ball.vx*=.997;
      if(frame%3===0)trails.push({x:ball.x,y:ball.y,life:22});
      for(const t of targets){if(!t.alive)continue;const dx=ball.x-t.x,dy=ball.y-t.y,dist=Math.hypot(dx,dy);if(dist<ball.r+t.r){t.alive=false;ball.autoTarget=null;burst(t.x,t.y);ball.vx*=.68;ball.vy-=2;status.textContent='命中！';}}
      for(const b of blocks){if(!b.alive||ball.autoTarget)continue;const nx=Math.max(b.x,Math.min(ball.x,b.x+b.w)),ny=Math.max(b.y,Math.min(ball.y,b.y+b.h));if(Math.hypot(ball.x-nx,ball.y-ny)<ball.r){b.alive=false;burst(nx,ny);ball.vx*=.72;ball.vy*=.65;}}
      if(ball.y+ball.r>ground){ball.y=ground-ball.r;ball.vy*=-.34;ball.vx*=.72}
      if(targets.every(t=>!t.alive)){finish(true)}else if(ball.x>W+45||ball.x< -65||ball.y>H+40||Math.hypot(ball.vx,ball.vy)<1.1&&ball.y>ground-55){settle++;if(settle>22){ball=null;if(shots>=stages[level].ammo)finish(false);else{phase='ready';status.textContent=`还剩 ${stages[level].ammo-shots} 发，点目标继续`}}}else settle=0;
    }
    trails=trails.filter(t=>--t.life>0);for(const p of particles){p.x+=p.vx;p.y+=p.vy;p.vy+=.12;p.life--}particles=particles.filter(p=>p.life>0);
    }
    function circleImage(img,x,y,r){ctx.save();ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.clip();if(img.complete&&img.naturalWidth){const s=Math.max(2*r/img.width,2*r/img.height);ctx.drawImage(img,x-img.width*s/2,y-img.height*s/2,img.width*s,img.height*s)}else{ctx.fillStyle='#ffd45b';ctx.fillRect(x-r,y-r,r*2,r*2)}ctx.restore();ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.lineWidth=4;ctx.strokeStyle='#fff3c4';ctx.stroke();ctx.lineWidth=2;ctx.strokeStyle='#24344c';ctx.stroke()}
    function circleHero(x,y,r){ctx.save();ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.clip();if(hero.complete&&hero.naturalWidth){ctx.drawImage(hero,hero.width*.497,hero.height*.005,hero.width*.257,hero.height*.33,x-r,y-r,r*2,r*2)}else{ctx.fillStyle='#ffd45b';ctx.fillRect(x-r,y-r,r*2,r*2)}ctx.restore();ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.lineWidth=4;ctx.strokeStyle='#f9c64d';ctx.stroke();ctx.lineWidth=2;ctx.strokeStyle='#24344c';ctx.stroke()}
    function draw(){ctx.clearRect(0,0,W,H);const sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#69c8ed');sky.addColorStop(.77,'#b4eae5');sky.addColorStop(1,'#f2d492');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
      ctx.fillStyle='#ffffff88';for(let i=0;i<4;i++){const x=50+i*110,y=92+(i%2)*67;ctx.beginPath();ctx.ellipse(x,y,37,12,0,0,7);ctx.ellipse(x-14,y-10,18,17,0,0,7);ctx.ellipse(x+12,y-14,22,18,0,0,7);ctx.fill()}
      ctx.fillStyle='#7fc488';ctx.beginPath();ctx.ellipse(90,ground+12,180,70,0,0,7);ctx.ellipse(330,ground+12,180,90,0,0,7);ctx.fill();ctx.fillStyle='#6a9a52';ctx.fillRect(0,ground,W,H-ground);ctx.fillStyle='#477c42';ctx.fillRect(0,ground,W,7);
      ctx.fillStyle='#633d32';ctx.fillRect(73,432,18,ground-432);ctx.strokeStyle='#51362d';ctx.lineWidth=13;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(82,452);ctx.lineTo(66,399);ctx.moveTo(82,452);ctx.lineTo(102,400);ctx.stroke();
      const p=drag?dragPoint:{x:sling.x,y:sling.y};if(phase==='ready'){ctx.strokeStyle='#3d2c2a';ctx.lineWidth=6;ctx.beginPath();ctx.moveTo(66,400);ctx.lineTo(p.x,p.y);ctx.moveTo(102,400);ctx.lineTo(p.x,p.y);ctx.stroke();if(drag){const vx=(sling.x-p.x)*.20,vy=(sling.y-p.y)*.20;ctx.fillStyle='#ffffffa0';for(let i=5;i<=30;i+=5){let x=p.x+vx*i,y=p.y+vy*i+G*i*i/2;if(x>W)break;ctx.beginPath();ctx.arc(x,y,3,0,7);ctx.fill()}}circleHero(p.x,p.y,21)}
      for(const b of blocks){if(!b.alive)continue;ctx.fillStyle='#84523b';ctx.fillRect(b.x,b.y,b.w,b.h);ctx.fillStyle='#bd8050';ctx.fillRect(b.x+2,b.y+2,b.w-4,Math.max(3,b.h-6));ctx.strokeStyle='#583b32';ctx.lineWidth=2;ctx.strokeRect(b.x,b.y,b.w,b.h)}
      for(const t of targets)if(t.alive){ctx.fillStyle='#ffffff60';ctx.beginPath();ctx.ellipse(t.x,t.y+t.r+6,t.r+3,6,0,0,7);ctx.fill();circleImage(imgs[t.face],t.x,t.y,t.r)}
      for(const tr of trails){ctx.fillStyle=`rgba(255,255,255,${tr.life/50})`;ctx.beginPath();ctx.arc(tr.x,tr.y,5*tr.life/22,0,7);ctx.fill()}
      if(ball)circleHero(ball.x,ball.y,ball.r);
      for(const p of particles){ctx.fillStyle=`rgba(255,209,71,${p.life/30})`;ctx.beginPath();ctx.arc(p.x,p.y,4*p.life/30,0,7);ctx.fill()}
      ctx.fillStyle='#193957aa';ctx.font='bold 15px system-ui';ctx.textAlign='right';ctx.fillText(`剩余 ${stages[level].ammo-shots} 发`,W-15,H-22);
    }
    function loop(ts){if(ts-last>12){update();draw();last=ts}requestAnimationFrame(loop)}resize();load(0);requestAnimationFrame(loop);
  })();
  </script>
</body>
</html>
