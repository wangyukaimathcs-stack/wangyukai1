<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#182b50">
  <meta name="description" content="拉动弹弓，发射郝祥宏，挑战三关的手机小游戏。">
  <title>愤怒的郝祥宏</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='29' fill='%23f9c64d'/%3E%3Cpath d='M14 36 5 12M14 36l20 12m16-12 9-24M50 36 30 48' fill='none' stroke='%23182b50' stroke-width='6' stroke-linecap='round'/%3E%3C/svg%3E">
  <style>
    :root{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:#fff;background:#142543}*{box-sizing:border-box}html,body{margin:0;min-height:100%;overscroll-behavior:none}body{display:flex;justify-content:center;background:radial-gradient(circle at 50% 0%,#355d82,#142543 74%)}button{font:inherit;cursor:pointer;border:0}main{width:min(100%,520px);min-height:100svh;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 14px) 14px calc(env(safe-area-inset-bottom) + 16px);gap:12px}.top{display:flex;align-items:center;justify-content:space-between;gap:8px}.title{font-size:clamp(24px,7vw,32px);font-weight:950;letter-spacing:-.04em;margin:0;line-height:1.1;text-shadow:0 3px #0e2340}.pill{background:#ffffff20;border:1px solid #ffffff30;border-radius:999px;padding:9px 12px;font-size:14px;font-weight:800;white-space:nowrap}.board-wrap{position:relative;flex:1;min-height:420px;max-height:720px;border:4px solid #dce8fb;border-radius:24px;overflow:hidden;background:#9edcf0;box-shadow:0 14px 0 #0a1b34,0 22px 30px #071a3580;touch-action:none}.board-wrap:before{content:"";position:absolute;inset:0;box-shadow:inset 0 0 0 2px #263c5870;z-index:2;pointer-events:none;border-radius:19px}canvas{display:block;width:100%;height:100%;touch-action:none}.status{position:absolute;top:14px;left:50%;transform:translateX(-50%);background:#142543df;border:1px solid #ffffff55;border-radius:12px;padding:7px 12px;font-weight:850;font-size:15px;white-space:nowrap;pointer-events:none;max-width:90%;overflow:hidden;text-overflow:ellipsis}.bottom{display:flex;justify-content:space-between;align-items:center;gap:12px}.hint{font-size:15px;line-height:1.45;color:#e7f4ff;margin:0}.btn{background:#f9c64d;color:#1a2943;font-weight:900;border-radius:14px;min-height:48px;padding:0 17px;box-shadow:0 5px 0 #b36f24;white-space:nowrap}.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #b36f24}.overlay{position:absolute;inset:0;background:#11284cc9;display:none;align-items:center;justify-content:center;padding:24px;z-index:4;text-align:center}.overlay.show{display:flex}.card{background:#fff8e8;color:#172748;border:4px solid #fff;border-radius:25px;padding:25px 20px;box-shadow:0 12px 0 #0a1d3b;max-width:340px;width:100%}.card h2{font-size:30px;margin:0 0 9px}.card p{font-size:17px;line-height:1.55;margin:0 0 21px}.card .btn{font-size:18px;min-width:140px}@media(max-height:700px){main{gap:8px}.board-wrap{min-height:350px}.hint{font-size:14px}}@media(min-width:700px){main{padding-top:24px;padding-bottom:28px}}main.landscape{position:relative;width:100%;max-width:none;height:100svh;min-height:0;gap:0;padding:0}main.landscape .top{display:none}main.landscape .board-wrap{flex:1;align-self:stretch;width:100%;aspect-ratio:auto;min-height:0;max-height:none;border:0;border-radius:0;box-shadow:none}main.landscape .hint,main.landscape .status{display:none}main.landscape .bottom{position:absolute;left:4px;bottom:4px;z-index:3;min-height:0}main.landscape .btn{min-height:30px;padding:0 10px;font-size:13px}@media(orientation:portrait) and (max-width:700px){main.landscape{position:fixed;top:0;left:100vw;width:100dvh;height:100vw;max-width:none;transform-origin:top left;transform:rotate(90deg);z-index:10}}
  </style>
</head>
<body>
  <main id="app">
    <header class="top"><h1 class="title">愤怒的郝祥宏</h1><span class="pill" id="levelLabel">第 1 / 3 关</span></header>
    <div class="board-wrap" id="board"><canvas id="game" aria-label="弹弓闯关游戏：拖动左侧头像向后拉，松手发射"></canvas><div class="status" id="status">横屏后拉动弹弓发射</div><div class="overlay" id="overlay"><div class="card"><h2 id="resultTitle"></h2><p id="resultText"></p><button class="btn" id="advance"></button></div></div></div>
    <footer class="bottom"><p class="hint" id="hint">按住头像往左下拉，松开发射。</p><button class="btn" id="restart" type="button">重开本关</button></footer>
  </main>
  <script>
  (()=>{
    const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
    const board=document.getElementById('board'),status=document.getElementById('status'),overlay=document.getElementById('overlay');
    const levelLabel=document.getElementById('levelLabel'),resultTitle=document.getElementById('resultTitle'),resultText=document.getElementById('resultText'),advance=document.getElementById('advance');
    const photoVersion='20260926b';function loadPhoto(path){const img=new Image();let retried=false;img.onerror=()=>{if(!retried){retried=true;img.src=path+'?v='+photoVersion+'&retry='+Date.now()}};img.src=path+'?v='+photoVersion;return img}const imgs=[1,2,3,4].map(n=>loadPhoto(`assets/face-${n}.png`));const hero=loadPhoto('portrait.jpg');
    let W=390,H=620,ground=548,G=.28;const sling={x:83,y:426};
    const stages=[
      {ammo:12,targets:[{x:990,y:272,r:19,hp:1},{x:970,y:185,r:19,hp:2},{x:1010,y:92,r:19,hp:1},{x:720,y:112,r:19,hp:1,swing:true,anchorX:720,anchorY:22,length:90}],blocks:[{x:890,y:300,w:155,h:12},{x:905,y:277,w:16,h:23},{x:900,y:215,w:145,h:12},{x:900,y:227,w:16,h:48},{x:930,y:126,w:115,h:12},{x:930,y:138,w:16,h:74}]},
      {ammo:4,targets:[{x:285,y:474,r:21,hp:1},{x:340,y:474,r:21,hp:1},{x:312,y:375,r:21,hp:1}],blocks:[{x:258,y:500,w:105,h:14},{x:263,y:404,w:100,h:14},{x:267,y:418,w:14,h:81},{x:343,y:418,w:14,h:81}]},
      {ammo:5,targets:[{x:255,y:478,r:20,hp:1},{x:325,y:478,r:20,hp:1},{x:286,y:392,r:20,hp:1},{x:346,y:351,r:20,hp:1}],blocks:[{x:233,y:504,w:132,h:14},{x:235,y:418,w:119,h:15},{x:240,y:433,w:15,h:71},{x:339,y:433,w:15,h:71},{x:303,y:375,w:67,h:13}]}
    ];
    let level=0,shots=0,targets=[],blocks=[],ball=null,drag=false,dragPoint={x:0,y:0},particles=[],trails=[],frame=0,phase='ready',settle=0,last=0;
    function resize(){const d=Math.min(devicePixelRatio||1,2);canvas.width=W*d;canvas.height=H*d;ctx.setTransform(d,0,0,d,0,0)}
    function load(n){level=n;W=n===0?1080:390;H=n===0?360:620;ground=n===0?315:548;G=n===0?.30:.28;sling.x=n===0?135:83;sling.y=n===0?220:426;document.getElementById('app').classList.toggle('landscape',n===0);resize();document.getElementById('hint').textContent=n===0?'横屏：按住头像向左下拉，松手发射。':'按住头像往左下拉，松开发射。';shots=0;targets=stages[n].targets.map((v,i)=>({...v,alive:true,face:(i+n)%4}));blocks=stages[n].blocks.map(v=>({...v,alive:true}));ball=null;drag=false;particles=[];trails=[];phase='ready';settle=0;overlay.classList.remove('show');levelLabel.textContent=`第 ${n+1} / 3 关`;status.textContent=n===0?'拉动弹弓，击落木架与晃动目标！':'拉动弹弓，松开发射！'}
    function screen(e){const r=canvas.getBoundingClientRect();if(level===0&&matchMedia('(orientation:portrait) and (max-width:700px)').matches)return{x:(e.clientY-r.top)*W/r.height,y:(r.right-e.clientX)*H/r.width};return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}
    function clampPull(p){let dx=p.x-sling.x,dy=p.y-sling.y;const l=Math.hypot(dx,dy);const max=level===0?120:91;if(l>max){dx*=max/l;dy*=max/l}return{x:sling.x+dx,y:sling.y+dy}}
    function launch(x,y,vx,vy){ball={x,y,vx,vy,r:level===0?17:21,active:true};shots++;phase='flying';settle=0;trails=[];status.textContent=`已发射 ${shots} / ${stages[level].ammo} 发`}
    canvas.addEventListener('pointerdown',e=>{if(phase!=='ready')return;const p=screen(e);if(Math.hypot(p.x-sling.x,p.y-sling.y)>85)return;e.preventDefault();canvas.setPointerCapture(e.pointerId);drag=true;dragPoint=clampPull(p);status.textContent='瞄准中…松手发射';});
    canvas.addEventListener('pointermove',e=>{if(!drag)return;e.preventDefault();dragPoint=clampPull(screen(e))});
    function release(){if(!drag)return;drag=false;const dx=sling.x-dragPoint.x,dy=sling.y-dragPoint.y;if(Math.hypot(dx,dy)<8){status.textContent='往后拉远一点！';return}launch(dragPoint.x,dragPoint.y,dx*(level===0?.30:.20),dy*(level===0?.30:.20))}
    canvas.addEventListener('pointerup',release);canvas.addEventListener('pointercancel',()=>{drag=false});
    document.getElementById('restart').onclick=()=>load(level);
    advance.onclick=()=>load(level===2?0:level+1);
    function finish(win){phase='end';resultTitle.textContent=win?(level===2?'全部通关！':'过关！'):'这关没打中';resultText.textContent=win?(level===2?'郝祥宏的弹弓冒险完成啦！':'准备挑战下一关。'):'调整角度，再来一次！';advance.textContent=win?(level===2?'从头再玩':'下一关'):'再试一次';advance.onclick=()=>load(win?(level===2?0:level+1):level);overlay.classList.add('show');status.textContent=win?'目标全部命中！':'子弹用完了'}
    function burst(x,y){for(let i=0;i<12;i++){const a=Math.random()*Math.PI*2,s=1+Math.random()*3;particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:30})}}
    function segmentRect(x,y,dx,dy,b,r){let enter=0,leave=1;for(const [p,d,lo,hi] of [[x,dx,b.x-r,b.x+b.w+r],[y,dy,b.y-r,b.y+b.h+r]]){if(Math.abs(d)<1e-9){if(p<lo||p>hi)return Infinity}else{const a=(lo-p)/d,c=(hi-p)/d;enter=Math.max(enter,Math.min(a,c));leave=Math.min(leave,Math.max(a,c));if(enter>leave)return Infinity}}return enter}
    function segmentCircle(x,y,dx,dy,t,r){const ox=x-t.x,oy=y-t.y,rr=r+t.r,a=dx*dx+dy*dy,b=2*(ox*dx+oy*dy),c=ox*ox+oy*oy-rr*rr;if(c<=0)return 0;const det=b*b-4*a*c;if(det<0||a===0)return Infinity;const u=(-b-Math.sqrt(det))/(2*a);return u>=0&&u<=1?u:Infinity}
    function hitTarget(t){ball.hitTarget=t;t.hp--;if(t.hp===0)t.alive=false;burst(t.x,t.y);ball.vx*=.68;ball.vy-=2;status.textContent=t.alive?'护盾裂开，再打一次！':'命中！'}
    function update(){frame++;if(level===0){for(const t of targets)if(t.swing&&t.alive){const angle=Math.sin(frame*.045)*.75;t.x=t.anchorX+Math.sin(angle)*t.length;t.y=t.anchorY+Math.cos(angle)*t.length}}if(phase==='flying'&&ball){const oldX=ball.x,oldY=ball.y;ball.vy+=G;ball.x+=ball.vx;ball.y+=ball.vy;ball.vx*=.997;
      if(frame%3===0)trails.push({x:ball.x,y:ball.y,life:22});
      if(level===0){const dx=ball.x-oldX,dy=ball.y-oldY;let first=Infinity,object=null,kind='';for(const b of blocks)if(b.alive){const u=segmentRect(oldX,oldY,dx,dy,b,ball.r);if(u<first){first=u;object=b;kind='wood'}}for(const t of targets)if(t.alive&&ball.hitTarget!==t){const u=segmentCircle(oldX,oldY,dx,dy,t,ball.r);if(u<first){first=u;object=t;kind='target'}}if(object&&first<=1){ball.x=oldX+dx*first;ball.y=oldY+dy*first;if(kind==='wood'){object.alive=false;burst(ball.x,ball.y);ball=null;if(shots>=stages[level].ammo)finish(false);else{phase='ready';status.textContent=`木架已打掉，还剩 ${stages[level].ammo-shots} 发`}}else hitTarget(object)}}
      else{for(const t of targets){if(!t.alive||ball.hitTarget===t)continue;const dx=ball.x-t.x,dy=ball.y-t.y,dist=Math.hypot(dx,dy);if(dist<ball.r+t.r)hitTarget(t)}for(const b of blocks){if(!b.alive)continue;const nx=Math.max(b.x,Math.min(ball.x,b.x+b.w)),ny=Math.max(b.y,Math.min(ball.y,b.y+b.h));const dx=ball.x-nx,dy=ball.y-ny,dist=Math.hypot(dx,dy);if(dist<ball.r){b.alive=false;burst(nx,ny);ball.vx*=.72;ball.vy*=.65}}}
      if(!ball)return;
      if(ball.y+ball.r>ground){ball.y=ground-ball.r;ball.vy*=-.34;ball.vx*=.72}
      if(targets.every(t=>!t.alive)){finish(true)}else if(ball.x>W+45||ball.x< -65||ball.y>H+40||Math.hypot(ball.vx,ball.vy)<1.1&&ball.y>ground-55){settle++;if(settle>22){ball=null;if(shots>=stages[level].ammo)finish(false);else{phase='ready';status.textContent=`还剩 ${stages[level].ammo-shots} 发，继续拉弹弓`}}}else settle=0;
    }
    trails=trails.filter(t=>--t.life>0);for(const p of particles){p.x+=p.vx;p.y+=p.vy;p.vy+=.12;p.life--}particles=particles.filter(p=>p.life>0);
    }
    function circleImage(img,x,y,r){ctx.save();ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.clip();if(img.complete&&img.naturalWidth){const s=Math.max(2*r/img.width,2*r/img.height);ctx.drawImage(img,x-img.width*s/2,y-img.height*s/2,img.width*s,img.height*s)}else{ctx.fillStyle='#ffd45b';ctx.fillRect(x-r,y-r,r*2,r*2)}ctx.restore();ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.lineWidth=4;ctx.strokeStyle='#fff3c4';ctx.stroke();ctx.lineWidth=2;ctx.strokeStyle='#24344c';ctx.stroke()}
    function circleHero(x,y,r){ctx.save();ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.clip();if(hero.complete&&hero.naturalWidth){ctx.drawImage(hero,hero.width*.497,hero.height*.005,hero.width*.257,hero.height*.33,x-r,y-r,r*2,r*2)}else{ctx.fillStyle='#ffd45b';ctx.fillRect(x-r,y-r,r*2,r*2)}ctx.restore();ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.lineWidth=4;ctx.strokeStyle='#f9c64d';ctx.stroke();ctx.lineWidth=2;ctx.strokeStyle='#24344c';ctx.stroke()}
    function draw(){ctx.clearRect(0,0,W,H);const sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#69c8ed');sky.addColorStop(.77,'#b4eae5');sky.addColorStop(1,'#f2d492');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
      ctx.fillStyle='#ffffff88';for(let i=0;i<(level===0?9:4);i++){const x=50+i*(level===0?125:110),y=92+(i%2)*67;ctx.beginPath();ctx.ellipse(x,y,37,12,0,0,7);ctx.ellipse(x-14,y-10,18,17,0,0,7);ctx.ellipse(x+12,y-14,22,18,0,0,7);ctx.fill()}
      ctx.fillStyle='#7fc488';ctx.beginPath();if(level===0){ctx.ellipse(250,ground+12,380,65,0,0,7);ctx.ellipse(850,ground+12,400,75,0,0,7)}else{ctx.ellipse(90,ground+12,180,70,0,0,7);ctx.ellipse(330,ground+12,180,90,0,0,7)}ctx.fill();ctx.fillStyle='#6a9a52';ctx.fillRect(0,ground,W,H-ground);ctx.fillStyle='#477c42';ctx.fillRect(0,ground,W,7);
      const shift=sling.x-83,shiftY=sling.y-426;ctx.fillStyle='#633d32';ctx.fillRect(73+shift,432+shiftY,18,ground-(432+shiftY));ctx.strokeStyle='#51362d';ctx.lineWidth=13;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(82+shift,452+shiftY);ctx.lineTo(66+shift,399+shiftY);ctx.moveTo(82+shift,452+shiftY);ctx.lineTo(102+shift,400+shiftY);ctx.stroke();
      const p=drag?dragPoint:{x:sling.x,y:sling.y};if(phase==='ready'){ctx.strokeStyle='#3d2c2a';ctx.lineWidth=6;ctx.beginPath();ctx.moveTo(66+shift,400+shiftY);ctx.lineTo(p.x,p.y);ctx.moveTo(102+shift,400+shiftY);ctx.lineTo(p.x,p.y);ctx.stroke();if(drag){const speed=level===0?.30:.20,vx=(sling.x-p.x)*speed,vy=(sling.y-p.y)*speed;ctx.fillStyle='#ffffffa0';if(level===0){let px=p.x,py=p.y,pvx=vx,pvy=vy;for(let i=1;i<=70;i++){const ox=px,oy=py;pvy+=G;px+=pvx;py+=pvy;pvx*=.997;if(py+17>ground){py=ground-17;pvy*=-.34;pvx*=.72}if(i%5===0){ctx.beginPath();ctx.arc(px,py,3.5,0,7);ctx.fill()}if(px>W||px<0||blocks.some(b=>b.alive&&segmentRect(ox,oy,px-ox,py-oy,b,17)<=1))break}}else{for(let i=5;i<=30;i+=5){let x=p.x+vx*i,y=p.y+vy*i+G*i*i/2;if(x>W)break;ctx.beginPath();ctx.arc(x,y,3,0,7);ctx.fill()}}}circleHero(p.x,p.y,level===0?17:21)}
      for(const b of blocks){if(!b.alive)continue;ctx.fillStyle='#84523b';ctx.fillRect(b.x,b.y,b.w,b.h);ctx.fillStyle='#bd8050';ctx.fillRect(b.x+2,b.y+2,b.w-4,Math.max(3,b.h-6));ctx.strokeStyle='#583b32';ctx.lineWidth=2;ctx.strokeRect(b.x,b.y,b.w,b.h)}
      for(const t of targets)if(t.alive){if(t.swing){ctx.strokeStyle='#4b5657';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(t.anchorX,t.anchorY);ctx.lineTo(t.x,t.y);ctx.stroke();ctx.fillStyle='#785942';ctx.beginPath();ctx.arc(t.anchorX,t.anchorY,7,0,7);ctx.fill()}else{ctx.fillStyle='#ffffff60';ctx.beginPath();ctx.ellipse(t.x,t.y+t.r+6,t.r+3,6,0,0,7);ctx.fill()}circleImage(imgs[t.face],t.x,t.y,t.r);if(level===0&&t.hp>1){ctx.beginPath();ctx.arc(t.x,t.y,t.r+6,0,7);ctx.strokeStyle='#2579c9';ctx.lineWidth=5;ctx.stroke();ctx.fillStyle='#174779';ctx.beginPath();ctx.arc(t.x+t.r,t.y-t.r,10,0,7);ctx.fill();ctx.fillStyle='#fff';ctx.font='bold 14px system-ui';ctx.textAlign='center';ctx.fillText('2',t.x+t.r,t.y-t.r+5)}}
      for(const tr of trails){ctx.fillStyle=`rgba(255,255,255,${tr.life/50})`;ctx.beginPath();ctx.arc(tr.x,tr.y,5*tr.life/22,0,7);ctx.fill()}
      if(ball)circleHero(ball.x,ball.y,ball.r);
      for(const p of particles){ctx.fillStyle=`rgba(255,209,71,${p.life/30})`;ctx.beginPath();ctx.arc(p.x,p.y,4*p.life/30,0,7);ctx.fill()}
      ctx.fillStyle='#193957aa';ctx.font='bold 15px system-ui';ctx.textAlign='right';ctx.fillText(`剩余 ${stages[level].ammo-shots} 发`,W-15,H-22);
    }
    function loop(ts){if(ts-last>12){update();draw();last=ts}requestAnimationFrame(loop)}load(0);requestAnimationFrame(loop);
  })();
  </script>
</body>
</html>
